
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Start</title>
    <style>
        body{
           background: linear-gradient(90deg, #89f7fe, #66a6ff);

        }
       
    </style>
    
</head>

<body style="text-align: center; ">
    <h2 style="font-size: 45px;;"> Enter Your Name</h2>
    <input type="text" id="playerName" placeholder="Enter your name" style="font-size: 30px;">
    <button onclick="startGame()" style="font-size: 30px;" >Start Game</button>

    <script>
        function startGame() {
            let playerName = document.getElementById("playerName").value;
            if (playerName.trim() === "") {
                alert("Please enter your name!");
                return;
            }
            window.location.href = "game.html?name=" + encodeURIComponent(playerName);
        }
    </script>
</body>
</html>
