<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Start</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="game-setup">
        <h2>Enter Your Name</h2>
        <input type="text" id="playerName" placeholder="Enter your name">
    
        <br><br>
    
        <h2>Select Time Limit</h2>
        <select id="timeLimit">
            <option value="0">select time </option>
            <option value="10">10 sec</option>
            <option value="15"> 15 sec</option>
            <option value="30"> 30 sec</option>
            <option value="45">45 sec</option>
            <option value="60">1 min</option>
        </select>
    
        <br><br>
    
        <button onclick="startGame()" class="start-btn">Start Game</button>
    </div>
    
    <script>
        function startGame() {
            let playerName = document.getElementById("playerName").value;
            let timeLimit = document.getElementById("timeLimit").value;

            if (playerName.trim() === "") {
                alert("Please enter your name!");
                return;
            }

            window.location.href = "game.html?name=" + encodeURIComponent(playerName) + "&time=" + timeLimit;
        }
    </script>
</body>
</html>
